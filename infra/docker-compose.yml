version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: medcart
      POSTGRES_PASSWORD: medcart
      POSTGRES_DB: medcart
    ports:
      - "5432:5432"
    volumes:
      - ../backend/internal/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://medcart:medcart@postgres:5432/medcart?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "medcart_secret_key"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
    depends_on:
      - backend
